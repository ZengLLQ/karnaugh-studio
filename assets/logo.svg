<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0FAF9A" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#4F46E5" stroke-width="4" />

  <!-- 4x4 K-Map Grid Matrix -->
  <!-- Outer Grid Border -->
  <rect x="48" y="48" width="160" height="160" rx="16" fill="#181838" stroke="#4338CA" stroke-width="2" />

  <!-- Grid Dividing Lines -->
  <line x1="88" y1="48" x2="88" y2="208" stroke="#3730A3" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="128" y1="48" x2="128" y2="208" stroke="#4338CA" stroke-width="2" />
  <line x1="168" y1="48" x2="168" y2="208" stroke="#3730A3" stroke-width="1.5" stroke-dasharray="3,3" />

  <line x1="48" y1="88" x2="208" y2="88" stroke="#3730A3" stroke-width="1.5" stroke-dasharray="3,3" />
  <line x1="48" y1="128" x2="208" y2="128" stroke="#4338CA" stroke-width="2" />
  <line x1="48" y1="168" x2="208" y2="168" stroke="#3730A3" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Inactive Minterm Dots / Labels -->
  <circle cx="68" cy="68" r="3" fill="#4B5563" />
  <circle cx="108" cy="68" r="3" fill="#4B5563" />
  <circle cx="148" cy="68" r="3" fill="#4B5563" />
  <circle cx="188" cy="68" r="3" fill="#4B5563" />

  <circle cx="68" cy="188" r="3" fill="#4B5563" />
  <circle cx="108" cy="188" r="3" fill="#4B5563" />
  <circle cx="148" cy="188" r="3" fill="#4B5563" />
  <circle cx="188" cy="188" r="3" fill="#4B5563" />

  <circle cx="68" cy="108" r="3" fill="#4B5563" />
  <circle cx="68" cy="148" r="3" fill="#4B5563" />
  <circle cx="188" cy="108" r="3" fill="#4B5563" />
  <circle cx="188" cy="148" r="3" fill="#4B5563" />

  <!-- Active 2x2 Loop (Cells at [1..2, 1..2]: (108,108), (148,108), (108,148), (148,148)) -->
  <!-- Subtle Highlight Glow Fill -->
  <rect x="92" y="92" width="72" height="72" rx="16" fill="#0FAF9A" fill-opacity="0.2" />

  <!-- Crisp Loop Stroke -->
  <rect x="92" y="92" width="72" height="72" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#glow)" />

  <!-- Active High '1' Nodes with Accent Color -->
  <circle cx="108" cy="108" r="6" fill="#2DD4BF" />
  <circle cx="148" cy="108" r="6" fill="#2DD4BF" />
  <circle cx="108" cy="148" r="6" fill="#2DD4BF" />
  <circle cx="148" cy="148" r="6" fill="#2DD4BF" />

  <!-- Central Minterm Cross Connector -->
  <path d="M108 108 L148 108 L148 148 L108 148 Z" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
